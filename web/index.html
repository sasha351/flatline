<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>flatline</title>
  <link rel="stylesheet" href="ui/style.css">
</head>
<body>
  <main>
    <canvas id="gl" aria-hidden="true"></canvas>
    <canvas id="stage" aria-hidden="true"></canvas>
    <div id="text" aria-hidden="true"></div>
    <header>
      <h1>flatline</h1>
      <div class="controls">
        <button id="connect" class="primary" type="button">Connect sensors</button>
        <button id="sim" type="button">Simulate</button>
        <button id="fs" type="button" title="Fullscreen, controls hidden (F)">Performance view</button>
        <label class="kit">Kit <select id="kit"></select></label>
        <p id="status" data-state="idle" role="status"></p>
      </div>
    </header>
    <div id="banner" hidden>
      <span id="bmsg"></span>
      <button id="reconnect" type="button">Reconnect</button>
    </div>
    <dl id="tempo" hidden>
      <div><dt>song bpm</dt><dd id="songbpm">--</dd></div>
      <div><dt>avg heart bpm</dt><dd id="avgbpm">--</dd></div>
    </dl>
    <div id="hint">
      <p id="idle" hidden>Connect the sensors, or press Simulate to hear a demo.</p>
      <p id="unsup" hidden>Use Chrome or Edge to connect sensors. Simulate still works.</p>
    </div>
    <div id="err" role="alert"></div>
    <ul id="sr" class="sr" aria-label="Players"></ul>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>
