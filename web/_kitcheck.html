<!doctype html><meta charset="utf-8">
<script type="module">
const rows = [];
try {
  const Tone = await import('https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm');
  const { KITS } = await import('./audio/kits.js');
  const { createEvolution } = await import('./audio/evolution.js');
  const VOICES = ['drums', 'bass', 'lead', 'pad'], heart = { on: true, settled: true, hr: 80, press: 0.5, breath: 0 };
  const db = (x) => (x > 0 ? (20 * Math.log10(x)).toFixed(1) : '-inf');
  for (const name of ['Trap', 'Dubstep', 'Footwork', 'Jersey club', 'Hard groove']) {
    const step = 60 / 160 / 4, row = [name.padEnd(12)], errs = {};
    for (const solo of [...VOICES, 'all']) {
      const buf = await Tone.Offline(async () => {
        const kit = KITS[name](Tone.getDestination()); await kit.ready;
        const evo = createEvolution(name), lastT = {};
        const hearts = VOICES.map((v) => (solo === 'all' || solo === v ? heart : { ...heart, on: false }));
        for (let s = 0; s < 32; s++) {
          const t = 0.05 + s * step; kit.update(Object.fromEntries(VOICES.map((v) => [v, heart])), t, s % 16);
          for (const e of evo.next({ raws: [0x1234, 0x5678, 0x9abc, 0xdef0], hearts, stepSeconds: step })) {
            const key = e.voice === 'drums' ? e.params.drum : e.voice;
            try { kit[e.voice](e.params, heart, lastT[key] = Math.max(t + e.offset, (lastT[key] ?? 0) + 0.01)); } catch (err) { errs[key + ' ' + err.message] = 1; }
          }
        }
      }, 32 * step + 1);
      const d = buf.getChannelData(0); let sq = 0, bad = 0; for (const x of d) { if (!Number.isFinite(x)) bad++; sq += x * x; }
      row.push(`${solo} ${db(Math.sqrt(sq / d.length))}${bad ? ' NaN!' : ''}`);
    }
    rows.push(row.join(' | ')); if (Object.keys(errs).length) rows.push('   THROWN ' + Object.keys(errs).join('; '));
  }
  rows.push('DONE (rms dB)');
} catch (e) { rows.push('ERROR ' + (e?.stack || e)); }
await fetch('http://127.0.0.1:8799/', { method: 'POST', mode: 'no-cors', body: rows.join('\n') });
</script>
